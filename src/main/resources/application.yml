server:
  port: 8081

spring:
  application:
    name: spring-security-oauth2

  datasource:
    url: jdbc:h2:mem:oauth2_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-client-id
            client-secret: your-client-secret
            scope: openid, profile, email

app:
  admin-emails:
    - admin@gmail.com

logging:
  level:
    org.springframework.security: INFO
